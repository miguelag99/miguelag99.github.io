services:
  web:
    # Keep in sync with node-version in .github/workflows/deploy.yml
    image: node:24
    working_dir: /app
    environment:
      - WATCH_POLLING=true
    user: "0:0"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm/store
    command:
      - sh
      - -c
      - |
        set -e
        # Corepack is no longer bundled with Node >= 25, install pnpm via npm
        npm install -g pnpm@10
        pnpm config set store-dir /pnpm/store
        pnpm install --frozen-lockfile
        pnpm dev
    network_mode: host
    stdin_open: true
    tty: true

volumes:
  node_modules:
  pnpm_store:
